name: Update public projects

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-public-projects.yml'
      - 'scripts/update-public-projects.mjs'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: update-public-projects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate script syntax
        run: node --check scripts/update-public-projects.mjs

      - name: Validate README markers
        run: |
          set -euo pipefail
          start_count=$(grep -c '<!-- public-projects:start -->' README.md || true)
          end_count=$(grep -c '<!-- public-projects:end -->' README.md || true)
          test "$start_count" -eq 1
          test "$end_count" -eq 1

      - name: Generate project list
        run: node scripts/update-public-projects.mjs

      - name: Verify README integrity
        run: |
          set -euo pipefail
          for section in '# Léonel Sandjong' '## 👋 About me' '## 🚀 Public projects' '## 🧰 Stack' '## 📊 GitHub stats' '## 📬 Contact' 'github-contribution-grid-snake'; do
            grep -qF -- "$section" README.md
          done

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync public GitHub projects'
          file_pattern: README.md
